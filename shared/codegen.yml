schema: ./schema/schema.graphql
documents:
  - ../client/src/graphql/**/*.ts
generates:
  ./types/graphql/generated/schema.ts:
    plugins:
      - typescript
      - typescript-resolvers
    config:
      useTypeImports: true
      enumValues:
        BreweryType: ../../common/enums#BreweryType
  ./types/graphql/generated/operations.ts:
    plugins:
      - typescript
      - typescript-operations
    config:
      useTypeImports: true
      enumValues:
        BreweryType: ../../common/enums#BreweryType